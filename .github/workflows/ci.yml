name: CI

on:
  push:
    branches:
      - backport-hacs-client-foundation
      - package/wheemer-python-xsense
      - package/wheemer-python-xsense-integration-parity
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest build twine pip-audit
          python -m pip install -e .

      - name: Test
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q asynctest.py xsense tests

      - name: Metadata check
        run: python setup.py check --metadata --strict

      - name: Build
        run: python -m build --sdist --wheel

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit installed dependencies
        run: python -m pip_audit
